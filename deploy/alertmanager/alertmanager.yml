# Alertmanager configuration for MeterGate budget alerts.
#
# Usage:
#   alertmanager --config.file=deploy/alertmanager/alertmanager.yml
#
# The default receiver posts every alert to a generic webhook
# (http://localhost:8088/alert in this example). Point it at your
# favourite notifier — DingTalk / Feishu / Slack / Teams all accept
# webhooks; or run deploy/alertmanager/webhook_receiver.py to watch
# the payloads locally.

route:
  group_by: ["alertname", "layer", "scope"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: webhook
  routes:
    # Critical quota exhaustion goes straight through; warnings are
    # already grouped by layer+scope above.
    - matchers:
        - severity = "critical"
      receiver: webhook
      continue: true

receivers:
  - name: webhook
    webhook_configs:
      - url: "http://localhost:8088/alert"
        send_resolved: true

