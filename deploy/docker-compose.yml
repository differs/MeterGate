# MeterGate full-stack development environment.
# Usage:
#   docker compose -f deploy/docker-compose.yml up -d
#   METERGATE_UPSTREAM=http://127.0.0.1:9901/v1/chat/completions \
#   METERGATE_UPSTREAM_KEY=sk-mock \
#   METERGATE_API_KEYS=sk-bench-1 \
#   METERGATE_REDIS_ADDR=127.0.0.1:6380 \
#   METERGATE_PG_DSN=postgres://postgres:mg@127.0.0.1:5435/metergate \
#   METERGATE_KAFKA=127.0.0.1:29092 \
#   METERGATE_CLICKHOUSE=127.0.0.1:9000 \
#   go run ./cmd/metergate

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: mg
      POSTGRES_DB: metergate
    ports: ["5435:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    environment:
      CLICKHOUSE_DB: metergate
    volumes:
      - ./clickhouse-users.xml:/etc/clickhouse-server/users.d/default-user.xml:ro
    ports: ["8123:8123", "9000:9000"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8123/ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.4
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 768M
      - --node-id
      - "0"
      - --kafka-addr
      - PLAIN://0.0.0.0:29092
      - --advertise-kafka-addr
      - PLAIN://127.0.0.1:29092
    ports: ["29092:29092"]
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info"]
      interval: 5s
      timeout: 5s
      retries: 30

  mock-upstream:
    build: ../../research/bench/mock_upstream
    ports: ["9901:9901"]
